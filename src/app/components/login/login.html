<main class="login-page" id="main-content">

    <div class="login-card">
        <div class="login-card__header">
            <h1>HackAccess</h1>
        </div>

        @if (error) {
        <div role="alert" aria-live="assertive" class="login-error">
            {{ error }}
        </div>
        }

        <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
            <div class="form-group">
                <label for="email">Correu electrònic</label>
                <input id="email" type="email" formControlName="email" autocomplete="email"
                    [attr.aria-invalid]="form.get('email')?.invalid && form.get('email')?.touched"
                    [attr.aria-describedby]="form.get('email')?.invalid && form.get('email')?.touched ? 'email-error' : null"
                    placeholder="admin@hackaccess.dev" />
                @if (form.get('email')?.invalid && form.get('email')?.touched) {
                <span id="email-error" role="alert" class="field-error">
                    Introdueix un correu vàlid
                </span>
                }
            </div>

            <div class="form-group">
                <label for="password">Contrasenya</label>
                <input id="password" type="password" formControlName="password" autocomplete="current-password"
                    [attr.aria-invalid]="form.get('password')?.invalid && form.get('password')?.touched"
                    [attr.aria-describedby]="form.get('password')?.invalid && form.get('password')?.touched ? 'password-error' : null"
                    placeholder="••••••••" />
                @if (form.get('password')?.invalid && form.get('password')?.touched) {
                <span id="password-error" role="alert" class="field-error">
                    La contrasenya és obligatòria
                </span>
                }
            </div>

            <button type="submit" class="btn-submit" [disabled]="loading" [attr.aria-busy]="loading">
                {{ loading ? 'Entrant...' : 'Entrar' }}
            </button>
        </form>

        <a routerLink="/" class="back-link">Tornar a l'inici</a>
    </div>
</main>
